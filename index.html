<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Définitions et termes opposés des notions en -isme extraites de La philosophie de A à Z.">
  <title>Ismophilie — Dictionnaire</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <a class="skip" href="#reader">Aller à la définition</a>
  <header class="masthead"><h1><a href="./">Ismophilie</a></h1><p>La philosophie de A à Z <span>·</span> <span id="total"></span> notions en -isme</p></header>
  <main>
    <nav class="mode-nav" aria-label="Mode de consultation"><button id="dictionary-mode" aria-pressed="true">Dictionnaire</button><button id="quiz-mode" aria-pressed="false">Retrouver le terme</button></nav>
    <section id="quiz" aria-label="Retrouver le terme" hidden></section>
    <section class="dictionary" aria-label="Dictionnaire des ismes">
      <div class="toolbar"><div class="search-wrap"><span aria-hidden="true">⌕</span><label class="sr-only" for="search">Rechercher une notion ou une idée</label><input id="search" type="search" placeholder="Rechercher dans le dictionnaire…" autocomplete="off"><kbd aria-hidden="true">/</kbd></div></div>
      <nav id="alphabet" class="alphabet" aria-label="Filtrer par initiale"></nav>
      <div class="dictionary-body"><aside class="index"><div class="index-heading"><span>Notions</span><span id="count" role="status"></span></div><div id="entries" class="entry-list"></div></aside><article id="reader" tabindex="-1" aria-label="Définition de la notion"></article></div>
    </section>
  </main>
  <noscript><p>Activez JavaScript pour consulter et rechercher les définitions.</p></noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
